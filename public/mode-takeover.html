<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engaging</title>
<style>
  :root{ --red:#e01030; --ink:#050506; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink);cursor:none;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#fff}
  /* deep, near-black stage — one faint ember of red low and centered */
  #stage{position:fixed;inset:0;display:grid;place-items:center;
    background:
      radial-gradient(120% 80% at 50% 118%, rgba(224,16,48,.16), transparent 55%),
      radial-gradient(90% 70% at 50% -10%, rgba(255,255,255,.03), transparent 60%),
      var(--ink);}
  /* faint slow vignette breathing so black never feels dead */
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(70% 70% at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%);
    animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

  .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:34px;
    opacity:0;transform:translateY(10px);animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .15s forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* the wordmark — wide, quiet, with a light that sweeps across it */
  .mark{position:relative;font-weight:800;font-size:clamp(44px,7vw,104px);
    letter-spacing:.34em;padding-left:.34em;line-height:1;
    color:#eef0f3;
    -webkit-text-stroke:.5px rgba(255,255,255,.10);
    text-shadow:0 0 40px rgba(224,16,48,.10);}
  .mark::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    mix-blend-mode:screen;transform:translateX(-120%);
    animation:sweep 3.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}

  /* the one real motion element: a hairline that fills, with a travelling node */
  .line{position:relative;width:min(340px,54vw);height:1px;background:rgba(255,255,255,.10)}
  .line i{position:absolute;left:0;top:0;height:100%;width:0;
    background:linear-gradient(90deg,rgba(224,16,48,.2),var(--red));
    box-shadow:0 0 12px rgba(224,16,48,.7);animation:fill 6s cubic-bezier(.4,0,.1,1) forwards}
  @keyframes fill{0%{width:4%}70%{width:82%}100%{width:100%}}
  .line b{position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;
    box-shadow:0 0 10px var(--red),0 0 20px var(--red);transform:translate(-50%,-50%);
    animation:node 6s cubic-bezier(.4,0,.1,1) forwards}
  @keyframes node{0%{left:4%}70%{left:82%}100%{left:100%;opacity:0}}

  /* tiny, dim system tag — no slogans */
  .tag{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);
    font:600 10px/1 "Consolas","SF Mono",monospace;letter-spacing:.55em;padding-left:.55em;
    color:rgba(255,255,255,.22)}
  body.out{animation:out .55s ease forwards}
  @keyframes out{to{opacity:0;filter:blur(8px)}}
</style></head>
<body>
  <div id="stage">
    <div class="wrap">
      <div class="mark">VALORANT</div>
      <div class="line"><i></i><b></b></div>
    </div>
  </div>
  <div id="vig"></div>
  <div class="tag">JARVIS</div>
<script>
  // Backend closes this window when the game window is ready; safety self-close after 60s.
  setTimeout(function(){try{document.body.classList.add('out');setTimeout(function(){window.close();},550);}catch(e){}},60000);
</script>
</body></html>
