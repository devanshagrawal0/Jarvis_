name: "✨ Feature request"
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? A new widget, a Forge engine, a room feature…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Jarvis HUD / widgets
        - THE FORGE (quant lab)
        - HELIX (intelligence chamber)
        - APEX (trading room)
        - AI brain / agent runtime
        - Memory / Neural Vault
        - Device Mesh
        - Globe room
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
