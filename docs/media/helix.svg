<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0713"/><stop offset="1" stop-color="#06040c"/>
    </linearGradient>
    <linearGradient id="hpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161022"/><stop offset="1" stop-color="#110b1c"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.22"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2a1c42" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="580" fill="url(#hbg)"/>
  <rect width="1000" height="580" fill="url(#hgrid)"/>

  <!-- header -->
  <rect x="0" y="0" width="1000" height="46" fill="#120b1e"/>
  <circle cx="26" cy="23" r="6" fill="#a855f7"/>
  <text x="42" y="28" fill="#efe6ff" font-size="16" font-weight="700">HELIX</text>
  <text x="108" y="28" fill="#8a7aa8" font-size="12">Intelligence Chamber — reason, cross-examine, decide</text>
  <g font-size="11">
    <rect x="690" y="12" width="86" height="22" rx="5" fill="#1a1226" stroke="#a855f7" stroke-opacity="0.4"/><text x="733" y="27" text-anchor="middle" fill="#c9a6ff">The Oracle</text>
    <rect x="784" y="12" width="96" height="22" rx="5" fill="#26121a" stroke="#f0607d" stroke-opacity="0.4"/><text x="832" y="27" text-anchor="middle" fill="#f5a6b8">Red Team ▸</text>
    <rect x="888" y="12" width="90" height="22" rx="5" fill="#0e2233" stroke="#22d3ee" stroke-opacity="0.4"/><text x="933" y="27" text-anchor="middle" fill="#8fe6f5">→ Forge</text>
  </g>

  <!-- LEFT: 6-strand rail -->
  <rect x="12" y="58" width="210" height="510" rx="10" fill="url(#hpanel)" stroke="#2a1c42"/>
  <text x="28" y="82" fill="#b8a6d4" font-size="12" letter-spacing="2" font-weight="600">STRANDS</text>
  <g font-size="11.5">
    <!-- each strand row: dot, name, decay bar -->
    <g><circle cx="34" cy="108" r="5" fill="#22d3ee"/><text x="48" y="112" fill="#cfe0ef">Evidence</text><rect x="150" y="103" width="56" height="8" rx="4" fill="#12202e"/><rect x="150" y="103" width="46" height="8" rx="4" fill="#22d3ee"/></g>
    <g><circle cx="34" cy="140" r="5" fill="#4ade80"/><text x="48" y="144" fill="#cfe0ef">Strategy</text><rect x="150" y="135" width="56" height="8" rx="4" fill="#122a1c"/><rect x="150" y="135" width="52" height="8" rx="4" fill="#4ade80"/></g>
    <g><circle cx="34" cy="172" r="5" fill="#e6a63c"/><text x="48" y="176" fill="#cfe0ef">Construction</text><rect x="150" y="167" width="56" height="8" rx="4" fill="#2a2010"/><rect x="150" y="167" width="30" height="8" rx="4" fill="#e6a63c"/></g>
    <g><circle cx="34" cy="204" r="5" fill="#7f95c9"/><text x="48" y="208" fill="#cfe0ef">Memory</text><rect x="150" y="199" width="56" height="8" rx="4" fill="#1a1e2c"/><rect x="150" y="199" width="55" height="8" rx="4" fill="#7f95c9"/></g>
    <g><circle cx="34" cy="236" r="5" fill="#f0607d"/><text x="48" y="240" fill="#cfe0ef">Signal</text><rect x="150" y="231" width="56" height="8" rx="4" fill="#2a1218"/><rect x="150" y="231" width="18" height="8" rx="4" fill="#f0607d"/></g>
    <g><circle cx="34" cy="268" r="5" fill="#a855f7"/><text x="48" y="272" fill="#cfe0ef">Synthesis</text><rect x="150" y="263" width="56" height="8" rx="4" fill="#221033"/><rect x="150" y="263" width="56" height="8" rx="4" fill="#a855f7"/></g>
  </g>
  <text x="28" y="300" fill="#6f5f8a" font-size="9.5">bars = freshness · per-strand decay</text>
  <line x1="28" y1="316" x2="206" y2="316" stroke="#2a1c42"/>
  <text x="28" y="340" fill="#b8a6d4" font-size="12" letter-spacing="1.5" font-weight="600">KNOWLEDGE RESERVOIR</text>
  <g font-size="10.5">
    <rect x="24" y="352" width="186" height="30" rx="7" fill="#150e22" stroke="#2a1c42"/><text x="34" y="371" fill="#cfe0ef">📄 fed-minutes-q2.pdf</text>
    <rect x="24" y="388" width="186" height="30" rx="7" fill="#150e22" stroke="#2a1c42"/><text x="34" y="407" fill="#cfe0ef">📄 nvda-10k-2025.pdf</text>
    <rect x="24" y="424" width="186" height="30" rx="7" fill="#150e22" stroke="#2a1c42"/><text x="34" y="443" fill="#cfe0ef">🔗 semis-supply-chain</text>
  </g>
  <line x1="28" y1="472" x2="206" y2="472" stroke="#2a1c42"/>
  <text x="28" y="494" fill="#f5a6b8" font-size="11" font-weight="600">◉ Red-team agents</text>
  <g font-size="10" fill="#b8a6d4">
    <text x="28" y="514">Skeptic · Steelman · Historian</text>
    <text x="28" y="532">Quant · Devil's Advocate</text>
    <text x="28" y="552" fill="#6f5f8a">5 agents · triangulation</text>
  </g>

  <!-- CENTER: reasoning graph -->
  <rect x="230" y="58" width="500" height="330" rx="10" fill="#0d0818" stroke="#2a1c42"/>
  <rect x="230" y="58" width="500" height="330" fill="url(#hglow)"/>
  <text x="246" y="82" fill="#b8a6d4" font-size="12" letter-spacing="1.5" font-weight="600">REASONING GRAPH</text>
  <text x="600" y="82" fill="#8a7aa8" font-size="10.5">bi-temporal · contradiction-aware</text>
  <!-- edges -->
  <g stroke="#5a3f7a" stroke-width="1.6" fill="none" opacity="0.8">
    <path d="M360 150 L 470 130"/><path d="M360 150 L 460 220"/>
    <path d="M470 130 L 590 170"/><path d="M460 220 L 590 170"/>
    <path d="M460 220 L 500 300"/><path d="M590 170 L 620 260"/>
  </g>
  <!-- contradiction edge -->
  <path d="M470 130 L 500 300" stroke="#f0607d" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity="0.85"/>
  <!-- nodes -->
  <g>
    <circle cx="360" cy="150" r="26" fill="#0e2233" stroke="#22d3ee" stroke-opacity="0.7"/><text x="360" y="154" text-anchor="middle" fill="#8fe6f5" font-size="9">claim A</text>
    <circle cx="470" cy="130" r="24" fill="#122a1c" stroke="#4ade80" stroke-opacity="0.7"/><text x="470" y="134" text-anchor="middle" fill="#9df0b8" font-size="9">thesis</text>
    <circle cx="460" cy="220" r="22" fill="#0e2233" stroke="#22d3ee" stroke-opacity="0.6"/><text x="460" y="224" text-anchor="middle" fill="#8fe6f5" font-size="9">evidence</text>
    <circle cx="590" cy="170" r="26" fill="#221033" stroke="#a855f7" stroke-opacity="0.8"/><text x="590" y="174" text-anchor="middle" fill="#c9a6ff" font-size="9">synthesis</text>
    <circle cx="500" cy="300" r="24" fill="#2a1218" stroke="#f0607d" stroke-opacity="0.8"/><text x="500" y="304" text-anchor="middle" fill="#f5a6b8" font-size="9">conflict</text>
    <circle cx="620" cy="260" r="20" fill="#1a1e2c" stroke="#7f95c9" stroke-opacity="0.6"/><text x="620" y="264" text-anchor="middle" fill="#aeb8d9" font-size="8.5">memory</text>
  </g>
  <text x="500" y="345" text-anchor="middle" fill="#f0607d" font-size="10">◄ 1 open contradiction flagged for triangulation ►</text>

  <!-- CENTER-LOWER: Oracle answer -->
  <rect x="230" y="396" width="500" height="172" rx="10" fill="url(#hpanel)" stroke="#2a1c42"/>
  <text x="246" y="420" fill="#a855f7" font-size="12" font-weight="600">◆ THE ORACLE</text>
  <text x="360" y="420" fill="#8a7aa8" font-size="10">grounded in reservoir + strands</text>
  <g font-size="10.5" fill="#cfe0ef">
    <text x="246" y="446">“Is the semis thesis still intact after Q2?”</text>
    <text x="246" y="470" fill="#b8a6d4" font-size="10">Synthesis: thesis holds on demand strength, but the</text>
    <text x="246" y="486" fill="#b8a6d4" font-size="10">margin claim conflicts with the 10-K — flagged. Confidence</text>
    <text x="246" y="502" fill="#b8a6d4" font-size="10">reduced from High → Medium pending reconciliation.</text>
  </g>
  <g font-size="9.5">
    <rect x="246" y="516" width="120" height="20" rx="10" fill="#150e22" stroke="#2a1c42"/><text x="306" y="530" text-anchor="middle" fill="#8fe6f5">◦ 4 citations</text>
    <rect x="374" y="516" width="150" height="20" rx="10" fill="#150e22" stroke="#2a1c42"/><text x="449" y="530" text-anchor="middle" fill="#f5a6b8">◦ 1 contradiction</text>
    <rect x="532" y="516" width="120" height="20" rx="10" fill="#150e22" stroke="#2a1c42"/><text x="592" y="530" text-anchor="middle" fill="#9df0b8">◦ ⊕ lock to Vault</text>
  </g>

  <!-- RIGHT: widgets + vault -->
  <rect x="738" y="58" width="250" height="510" rx="10" fill="url(#hpanel)" stroke="#2a1c42"/>
  <text x="754" y="82" fill="#b8a6d4" font-size="12" letter-spacing="1.5" font-weight="600">DASHBOARD WIDGETS</text>
  <!-- score meter -->
  <circle cx="800" cy="140" r="34" fill="none" stroke="#221033" stroke-width="8"/>
  <circle cx="800" cy="140" r="34" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" stroke-dasharray="150 214" transform="rotate(-90 800 140)"/>
  <text x="800" y="145" text-anchor="middle" fill="#efe6ff" font-size="20" font-weight="800">71</text>
  <text x="800" y="188" text-anchor="middle" fill="#b8a6d4" font-size="9.5">Helix Score</text>
  <!-- contradiction counter + agent hud -->
  <g font-size="10.5">
    <rect x="852" y="106" width="120" height="34" rx="8" fill="#26121a" stroke="#f0607d" stroke-opacity="0.4"/>
    <text x="866" y="122" fill="#f5a6b8" font-size="16" font-weight="700">1</text><text x="886" y="122" fill="#b8a6d4" font-size="9">open</text><text x="866" y="134" fill="#8a7aa8" font-size="8.5">Contradictions</text>
    <rect x="852" y="146" width="120" height="34" rx="8" fill="#0e2233" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="866" y="162" fill="#8fe6f5" font-size="16" font-weight="700">3</text><text x="886" y="162" fill="#b8a6d4" font-size="9">active</text><text x="866" y="174" fill="#8a7aa8" font-size="8.5">Agent HUD</text>
  </g>
  <!-- strand radar (hex) -->
  <g transform="translate(800,246)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#2a1c42" stroke-width="1.5"/>
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="none" stroke="#2a1c42" stroke-width="1"/>
    <polygon points="0,-34 30,-14 26,18 0,28 -32,15 -22,-16" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1.6"/>
    <g fill="#c9a6ff" font-size="8"><text x="-6" y="-44">Ev</text><text x="40" y="-16">St</text><text x="40" y="26">Cn</text><text x="-8" y="52">Mm</text><text x="-52" y="26">Sg</text><text x="-54" y="-16">Sy</text></g>
  </g>
  <text x="800" y="304" text-anchor="middle" fill="#b8a6d4" font-size="9.5">Strand Radar</text>
  <line x1="754" y1="320" x2="972" y2="320" stroke="#2a1c42"/>
  <!-- the wire -->
  <text x="754" y="342" fill="#b8a6d4" font-size="11" font-weight="600">~ The Wire</text>
  <g font-size="9.5" fill="#8a7aa8">
    <text x="754" y="360">◦ Skeptic challenged claim A</text>
    <text x="754" y="378">◦ 2 sources ingested → Evidence</text>
    <text x="754" y="396">◦ Synthesis strand refreshed</text>
    <text x="754" y="414">◦ Decision drafted (unlocked)</text>
  </g>
  <line x1="754" y1="430" x2="972" y2="430" stroke="#2a1c42"/>
  <!-- vault -->
  <text x="754" y="452" fill="#efe6ff" font-size="11" font-weight="600">⊡ Vault — locked decisions</text>
  <g font-size="9.5">
    <rect x="752" y="462" width="220" height="30" rx="7" fill="#150e22" stroke="#4ade80" stroke-opacity="0.35"/>
    <text x="762" y="481" fill="#9df0b8">✓ Overweight semis into H2 · Jun</text>
    <rect x="752" y="498" width="220" height="30" rx="7" fill="#150e22" stroke="#4ade80" stroke-opacity="0.35"/>
    <text x="762" y="517" fill="#9df0b8">✓ Hedge rate risk w/ TLT · May</text>
    <rect x="752" y="534" width="220" height="26" rx="7" fill="#150e22" stroke="#2a1c42"/>
    <text x="762" y="551" fill="#8a7aa8">⏱ Focus Timer · 12:44 remaining</text>
  </g>
</svg>
