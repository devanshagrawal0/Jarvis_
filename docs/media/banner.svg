<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c14"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.5" stop-color="#7fe9ff"/>
      <stop offset="1" stop-color="#5b9dff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b3a55" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>

  <!-- HUD corner brackets -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8">
    <path d="M28 28 h44 M28 28 v44"/>
    <path d="M1172 28 h-44 M1172 28 v44"/>
    <path d="M28 312 h44 M28 312 v-44"/>
    <path d="M1172 312 h-44 M1172 312 v-44"/>
  </g>

  <!-- eyebrow -->
  <text x="60" y="112" fill="#5fd0e6" font-size="17" letter-spacing="7" font-weight="600">LOCAL-FIRST · AI-NATIVE · COMMAND CENTER</text>

  <!-- title -->
  <text x="58" y="196" fill="url(#title)" font-size="82" font-weight="800" letter-spacing="1">JARVIS COMMAND OS</text>

  <!-- tagline -->
  <text x="60" y="240" fill="#aab8c9" font-size="21">A Jarvis-style assistant — reasoning brain, layered memory, live tools,</text>
  <text x="60" y="270" fill="#aab8c9" font-size="21">device mesh, and immersive 3D rooms. Flagship: <tspan fill="#7fe9ff" font-weight="700">THE FORGE</tspan> quant lab.</text>

  <!-- room chips -->
  <g font-size="14" font-weight="600">
    <g transform="translate(60,296)">
      <rect width="118" height="26" rx="13" fill="#0e2233" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="59" y="17" fill="#8fe6f5" text-anchor="middle">◆ THE FORGE</text>
    </g>
    <g transform="translate(188,296)">
      <rect width="92" height="26" rx="13" fill="#12182a" stroke="#3b82f6" stroke-opacity="0.5"/>
      <text x="46" y="17" fill="#9db8ff" text-anchor="middle">APEX</text>
    </g>
    <g transform="translate(290,296)">
      <rect width="96" height="26" rx="13" fill="#17122a" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="48" y="17" fill="#c9a6ff" text-anchor="middle">HELIX</text>
    </g>
    <g transform="translate(396,296)">
      <rect width="112" height="26" rx="13" fill="#0e2233" stroke="#2dd4bf" stroke-opacity="0.5"/>
      <text x="56" y="17" fill="#8ff0e0" text-anchor="middle">GLOBE ROOM</text>
    </g>
    <g transform="translate(518,296)">
      <rect width="124" height="26" rx="13" fill="#141a26" stroke="#4ade80" stroke-opacity="0.5"/>
      <text x="62" y="17" fill="#9df0b8" text-anchor="middle">DEVICE MESH</text>
    </g>
  </g>

  <!-- right-side stylized brain/orb -->
  <g transform="translate(1000,170)" opacity="0.9">
    <circle r="96" fill="none" stroke="#173a52" stroke-width="1.5"/>
    <circle r="70" fill="none" stroke="#1f5470" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle r="44" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle r="12" fill="#22d3ee" fill-opacity="0.9"/>
    <circle r="24" fill="#22d3ee" fill-opacity="0.12"/>
    <g stroke="#5b9dff" stroke-width="1.4" opacity="0.7">
      <path d="M-96 0 H-44 M44 0 H96 M0 -96 V-44 M0 44 V96"/>
    </g>
    <g fill="#7fe9ff">
      <circle cx="44" cy="0" r="3.5"/><circle cx="-44" cy="0" r="3.5"/>
      <circle cx="0" cy="-44" r="3.5"/><circle cx="0" cy="44" r="3.5"/>
      <circle cx="31" cy="-31" r="2.5"/><circle cx="-31" cy="31" r="2.5"/>
    </g>
  </g>
</svg>
